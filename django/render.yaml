# Propuesta de alojamiento para la entrega. Revisar planes antes de crear recursos.
services:
  - type: web
    name: fundo-san-carlos
    runtime: python
    plan: free
    healthCheckPath: /salud/
    buildCommand: pip install -r requirements-hosted.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && python manage.py preparar_demo_publica && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 60
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.hosted
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.14.5
      - key: DEMO_ADMIN_PASSWORD
        sync: false
      - key: DEMO_TRABAJADOR_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: san-carlos-presentacion
          property: connectionString
databases:
  - name: san-carlos-presentacion
    plan: free
    ipAllowList: []
